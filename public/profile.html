<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Builder Profile — Blueprint Arcade</title>
  <script src="/js/theme.js"></script>
  <meta name="description" content="Explore a Blueprint Arcade builder's profile and community builds." />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/builds.css" />
  <link rel="stylesheet" href="/css/phase4.css" />
</head>
<body>
  <div class="layout builds-layout">
    <aside class="sidebar">
      <h4>Discover</h4><a href="/">Builds</a><a href="/top10.html">Top 10</a>
      <h4>Games</h4><a href="/games.html">Directory</a><a href="/compare.html">Compare</a>
      <h4>Builds</h4><a href="/post.html">Post a Build</a>
      <h4>Community</h4><a href="/profile.html" class="active">My Profile</a><a href="/settings.html">Settings</a>
    </aside>
    <div class="main">
      <header class="topbar"><a class="btn" href="/">Showcase</a><a class="btn" href="/favorites.html">Favorites</a><a class="btn" href="/settings.html">Settings</a><button class="btn" type="button" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false">Dark mode</button></header>
      <main class="builds-page">
        <div id="profile-state" class="build-state" aria-live="polite"></div>
        <section id="profile-content" hidden>
          <div class="card profile-hero">
            <div id="profile-avatar" class="profile-avatar" aria-hidden="true"></div>
            <div class="profile-heading">
              <p class="builds-eyebrow">Builder profile</p>
              <h1 id="profile-name"></h1>
              <p id="profile-handle" class="profile-handle"></p>
              <p id="profile-bio" class="profile-bio"></p>
            </div>
            <div class="profile-stats" aria-label="Profile statistics">
              <div class="profile-stat"><strong id="profile-build-count">0</strong><span>Builds</span></div>
              <div class="profile-stat"><strong id="profile-pinned-count">0</strong><span>Pinned</span></div>
              <div class="profile-stat"><strong id="profile-follower-count">0</strong><span>Followers</span></div>
              <div class="profile-stat"><strong id="profile-following-count">0</strong><span>Following</span></div>
            </div>
            <div id="profile-actions" class="profile-actions"></div>
          </div>
          <form id="avatar-upload-form" class="card avatar-upload-form" hidden>
            <label>Choose an avatar image
              <input id="avatar-file" type="file" accept="image/jpeg,image/png,image/webp" />
            </label>
            <label class="consent-label"><input id="avatar-consent" type="checkbox" /> I have permission to share this image publicly.</label>
            <button id="avatar-upload-submit" class="btn" type="submit">Upload avatar</button>
            <p id="avatar-upload-status" role="status" aria-live="polite"></p>
          </form>
          <div id="saved-notice" class="saved-notice" hidden></div>
          <div class="profile-tabs" role="tablist" aria-label="Profile posts">
            <button id="profile-builds-tab" class="btn is-active" type="button" role="tab" aria-selected="true" aria-controls="profile-build-section">Builds</button>
            <button id="profile-reposts-tab" class="btn" type="button" role="tab" aria-selected="false" aria-controls="profile-reposts-section" tabindex="-1">Reposted</button>
          </div>
          <section id="profile-build-section" role="tabpanel" aria-labelledby="profile-builds-tab">
            <div class="build-section-heading"><h2 id="profile-build-title">Builds</h2><p id="profile-build-label"></p></div>
            <div id="profile-builds-state" class="build-state" aria-live="polite"></div>
            <div class="build-cards" id="my-builds"></div>
            <button id="profile-build-more" class="btn load-more-button" type="button" hidden>Load more</button>
          </section>
          <section id="profile-reposts-section" role="tabpanel" aria-labelledby="profile-reposts-tab" hidden>
            <div class="build-section-heading"><h2>Reposted</h2><p id="profile-reposts-label"></p></div>
            <div id="profile-reposts-state" class="build-state" aria-live="polite"></div>
            <div class="build-cards" id="my-reposts"></div>
            <button id="profile-reposts-more" class="btn load-more-button" type="button" hidden>Load more</button>
          </section>
        </section>
      </main>
    </div>
  </div>
  <script src="/js/approved-images.js"></script>
  <script src="/js/upload-path.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/builds-ui.js"></script>
  <script src="/js/avatar-upload.js"></script>
  <script src="/js/profile.js"></script>
  <script src="/js/social.js"></script>
</body>
</html>
