<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot password — Blueprint Arcade</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar auth-topbar">
    <a class="auth-brand" href="/">Blueprint Arcade</a>
    <nav class="auth-actions" aria-label="Account navigation">
      <a class="btn" href="/favorites.html">Favorites</a>
      <a class="btn btn-primary" href="/post.html">Post a Build</a>
      <a class="btn" href="/login.html">Log in</a>
      <a class="btn" href="/">Explore builds</a>
      <button class="btn" type="button" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false">Dark mode</button>
    </nav>
  </header>
  <main class="auth-page">
    <h1>Reset your password</h1>
    <form class="card auth-card" id="forgot-password-form">
      <div class="field">
        <label for="reset-email">Email address</label>
        <input id="reset-email" name="email" type="email" autocomplete="email" maxlength="254" required />
      </div>
      <button class="btn btn-primary" type="submit">Request reset link</button>
      <p id="forgot-password-status" role="status" aria-live="polite"></p>
      <p>For privacy, the response is the same whether or not an account matches.</p>
      <p>No email is sent. In Replit QA, generated reset links are written to workflow logs.</p>
      <p><a href="/login.html">Return to log in</a></p>
    </form>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/password-reset.js"></script>
</body>
</html>
