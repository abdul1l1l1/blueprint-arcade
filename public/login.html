<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — Blueprint Arcade</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main style="max-width:380px;margin:60px auto;padding:0 16px">
    <h1>Log in</h1>
    <form class="card" id="login-form" data-auth="login">
      <div class="field"><label for="username">Username or email</label><input id="username" name="username" autocomplete="username" required /></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required /></div>
      <button class="btn btn-primary" type="submit">Log in</button>
      <p>No account? <a href="/register.html">Register</a></p>
      <p class="error" id="login-error" role="alert"></p>
    </form>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/auth-form.js"></script>
</body>
</html>
