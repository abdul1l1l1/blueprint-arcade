<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register — Blueprint Arcade</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar auth-topbar">
    <a class="auth-brand" href="/">Blueprint Arcade</a>
    <nav class="auth-actions" aria-label="Account navigation">
      <a class="btn" href="/favorites.html">Favorites</a>
      <a class="btn btn-primary" href="/post.html">Post a Build</a>
      <a class="btn" href="/">Explore builds</a>
      <a class="btn" href="/login.html">Log in</a>
      <button class="btn" type="button" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false">Dark mode</button>
    </nav>
  </header>
  <main class="auth-page">
    <h1>Create an account</h1>
    <form class="card auth-card" id="register-form" data-auth="register">
      <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" pattern="[a-zA-Z0-9_]{3,20}" minlength="3" maxlength="20" required /></div>
      <div class="field"><label for="displayName">Display name</label><input id="displayName" name="displayName" autocomplete="nickname" maxlength="80" /></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required /></div>
      <div class="field"><label for="password">Password (8+ characters, up to 72 bytes)</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required /></div>
      <button class="btn btn-primary" type="submit">Register</button>
      <p>Already have an account? <a href="/login.html">Log in</a></p>
      <p class="error" id="register-error" role="alert"></p>
    </form>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/auth-form.js"></script>
</body>
</html>
