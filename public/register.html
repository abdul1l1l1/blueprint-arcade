<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register — Blueprint Arcade</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main style="max-width:380px;margin:60px auto;padding:0 16px">
    <h1>Create an account</h1>
    <form class="card" id="register-form" data-auth="register">
      <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" pattern="[a-zA-Z0-9_]{3,20}" minlength="3" maxlength="20" required /></div>
      <div class="field"><label for="displayName">Display name</label><input id="displayName" name="displayName" autocomplete="nickname" maxlength="80" /></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required /></div>
      <div class="field"><label for="password">Password (8+ characters, up to 72 bytes)</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required /></div>
      <button class="btn btn-primary" type="submit">Register</button>
      <p>Already have an account? <a href="/login.html">Log in</a></p>
      <p class="error" id="register-error" role="alert"></p>
    </form>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/auth-form.js"></script>
</body>
</html>
