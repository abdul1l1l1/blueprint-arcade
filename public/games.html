<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Directory — Blueprint Arcade</title>
  <script src="/js/theme.js"></script>
  <meta name="description" content="Browse architecture and building games, compare build activity, and find your next creative world in the Blueprint Arcade directory." />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/games.css" />
</head>
<body>
  <div class="layout games-layout">
    <aside class="sidebar" aria-label="Categories">
      <h4>Discover</h4>
      <a href="/">Builds</a>
      <a href="/top10.html">Top 10</a>
      <h4>Games</h4>
      <a href="/games.html" class="active" aria-current="page">Directory</a>
      <a href="/compare.html">Compare</a>
      <h4>Builds</h4>
      <a href="/post.html">Post a Build</a>
      <h4>Community</h4>
      <a href="/profile.html">My Profile</a>
      <a href="/settings.html">Settings</a>
    </aside>
  <div class="main">
    <header class="topbar">
      <a class="btn" href="/">Back to Showcase</a>
      <a class="btn" href="/favorites.html">Favorites</a>
      <a class="btn" href="/settings.html">Settings</a>
      <button class="btn" type="button" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false">Dark mode</button>
    </header>
    <main class="games-page directory-page">
      <header class="page-intro">
        <p class="eyebrow">Blueprint Arcade / Games</p>
        <h1>Find your next world to build in.</h1>
        <p class="page-lede">A field guide to the games where the community makes a place of its own.</p>
      </header>

      <form class="directory-controls card" id="game-filters" role="search">
        <div class="field search-field">
          <label for="game-query">Search games</label>
          <input id="game-query" name="q" type="search" maxlength="120" placeholder="Name, genre, or description" autocomplete="off" />
        </div>
        <div class="field">
          <label for="sandbox-filter">World type</label>
          <select id="sandbox-filter" name="sandbox">
            <option value="">All games</option>
            <option value="true">Sandbox</option>
            <option value="false">Non-sandbox</option>
          </select>
        </div>
        <div class="field">
          <label for="game-sort">Sort by</label>
          <select id="game-sort" name="sort">
            <option value="name">Name A–Z</option>
            <option value="builds">Most builds</option>
            <option value="rating">Highest build rating</option>
            <option value="newest">Newest release</option>
          </select>
        </div>
        <button class="btn btn-primary directory-submit" type="submit">Search games</button>
      </form>

      <div class="results-heading">
        <h2>Games</h2>
        <p id="games-count" aria-live="polite"></p>
      </div>
      <section id="games-state" class="games-state" aria-live="polite"></section>
      <div class="game-grid" id="games" aria-label="Game directory"></div>
    </main>
  </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/games.js"></script>
</body>
</html>
