<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choose a new password — Blueprint Arcade</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar auth-topbar">
    <a class="auth-brand" href="/">Blueprint Arcade</a>
    <nav class="auth-actions" aria-label="Account navigation">
      <a class="btn" href="/favorites.html">Favorites</a>
      <a class="btn btn-primary" href="/post.html">Post a Build</a>
      <a class="btn" href="/login.html">Log in</a>
      <a class="btn" href="/">Explore builds</a>
      <button class="btn" type="button" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false">Dark mode</button>
    </nav>
  </header>
  <main class="auth-page">
    <h1>Choose a new password</h1>
    <form class="card auth-card" id="reset-password-form">
      <div class="field">
        <label for="new-password">New password (8+ characters, up to 72 bytes)</label>
        <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required />
      </div>
      <div class="field">
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" name="confirmation" type="password" autocomplete="new-password" minlength="8" required />
      </div>
      <button class="btn btn-primary" type="submit">Update password</button>
      <p id="reset-password-status" role="status" aria-live="polite"></p>
      <p><a href="/login.html">Return to log in</a></p>
    </form>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/password-reset.js"></script>
</body>
</html>
